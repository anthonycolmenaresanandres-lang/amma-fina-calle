# Render Blueprint — MUST live at the repo ROOT (Render only auto-detects render.yaml
# at the root). With rootDir set, dockerfilePath and dockerContext are resolved
# RELATIVE TO rootDir (verified from a failed build: a repo-root path got doubled to
# services/voice-gateway/services/voice-gateway). So they stay rootDir-relative below.
# (The services/voice-gateway/render.yaml copy is kept for local reference only; THIS
# root file is the one Render uses.)
#
#   Render → New + → Blueprint → pick this repo → Apply.
#
# Secrets are marked sync:false so they are entered in the Render dashboard, not git.
services:
  - type: web
    name: fina-calle-voice-gateway
    runtime: docker
    rootDir: services/voice-gateway   # the service lives here; paths below are relative to it
    dockerfilePath: ./Dockerfile      # relative to rootDir
    dockerContext: .                  # relative to rootDir (so the Dockerfile COPY paths resolve)
    healthCheckPath: /healthz
    plan: starter # always-on (free tier sleeps; Twilio media streams need always-on)
    autoDeploy: true
    disk:
      name: store
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8080"
      - key: STORE_SNAPSHOT
        value: /data/store.json # durable across restarts/deploys (single instance)
      - key: PUBLIC_HOST
        sync: false # the onrender.com hostname (no scheme) — set after first deploy
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VOICE
        sync: false # Realtime voice. Use a stable GA voice (marin or cedar); alloy drifts on long calls.
      - key: BOOKING_CONNECTOR
        value: proposeconfirm # universal fallback; per-tenant connectors come from TENANTS_FILE
      - key: TENANTS_FILE
        value: /app/tenants.json # baked into the image (Dockerfile COPY) — Colattao info line + Fina Calle catch-all
      - key: STAFF_WEBHOOK_URL
        sync: false # optional staff alerts (Slack/Make/SMS)
      - key: MAX_CALL_SECONDS
        value: "300" # hard cap per call, 5 min — cost guard + curbs voice drift
      - key: WRAP_UP_SECONDS
        value: "30" # bot warmly wraps up this many seconds before the hard cap
      - key: MAX_CONCURRENT_CALLS
        value: "12" # reject new calls beyond this many simultaneous
      - key: PER_CALLER_MAX_PER_HOUR
        value: "12" # simple anti-robodialer cap per caller number
      - key: LINE_PAUSED
        value: "false" # kill switch — set "true" + redeploy to pause the line
