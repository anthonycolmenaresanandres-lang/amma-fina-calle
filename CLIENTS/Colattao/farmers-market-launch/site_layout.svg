<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Colattao Community Market Conceptual Site Layout</title>
  <desc id="desc">Conceptual layout showing yellow parking-space bazaar zone, possible overflow vendor edges, tenant entrances, drive aisles, emergency access, customer parking, and vendor loading parking.</desc>
  <rect width="1000" height="650" fill="#f8fafc"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Colattao Community Market - Conceptual Site Layout</text>
  <text x="40" y="70" font-family="Arial, sans-serif" font-size="14" fill="#374151">1115 Independence Blvd Suite 101/102, Virginia Beach, VA 23455 - confirm final map with landlord, city/zoning, fire, and health path.</text>

  <rect x="40" y="100" width="920" height="70" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="140" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">Independence Blvd / Public Access</text>

  <rect x="80" y="200" width="840" height="90" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <text x="405" y="250" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Main Drive Aisle - Keep Clear</text>
  <line x1="100" y1="245" x2="900" y2="245" stroke="#ef4444" stroke-width="6" stroke-dasharray="16 12"/>
  <text x="372" y="278" font-family="Arial, sans-serif" font-size="13" fill="#991b1b">Emergency / fire access route - no booths, vehicles, lines, signs, or bins</text>

  <rect x="80" y="320" width="220" height="120" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="110" y="350" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#14532d">Possible Vendor Edge A</text>
  <text x="110" y="374" font-family="Arial, sans-serif" font-size="13" fill="#14532d">4-7 booths if approved</text>
  <text x="110" y="398" font-family="Arial, sans-serif" font-size="13" fill="#14532d">No blocked aisles or doors</text>

  <rect x="700" y="320" width="220" height="120" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="730" y="350" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#14532d">Possible Vendor Edge B</text>
  <text x="730" y="374" font-family="Arial, sans-serif" font-size="13" fill="#14532d">4-7 booths if approved</text>
  <text x="730" y="398" font-family="Arial, sans-serif" font-size="13" fill="#14532d">Preserve customer parking</text>

  <rect x="340" y="318" width="320" height="125" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="390" y="348" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#92400e">Yellow Bazaar Zone</text>
  <text x="382" y="374" font-family="Arial, sans-serif" font-size="13" fill="#92400e">Closed parking spaces - vendor tables</text>
  <text x="376" y="396" font-family="Arial, sans-serif" font-size="13" fill="#92400e">Arts/crafts/makers - check-in - QR</text>
  <text x="358" y="418" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">Cooked food inside or food trucks only</text>

  <rect x="80" y="480" width="840" height="70" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="104" y="507" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Tenant Entrances - Keep Clear</text>
  <text x="104" y="532" font-family="Arial, sans-serif" font-size="12" fill="#374151">USAF Recruiting | Army Recruiting | Nara Sushi | Hair By the C | Dave's Toys | Paris Nails | Subway | Fox Music | Register Link | Colattao</text>

  <rect x="80" y="570" width="370" height="45" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="115" y="598" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4c1d95">Customer Parking - preserve for all tenants</text>

  <rect x="550" y="570" width="370" height="45" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="575" y="598" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#7f1d1d">Vendor Loading / Parking - approved area only</text>

  <rect x="790" y="110" width="130" height="40" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="813" y="135" font-family="Arial, sans-serif" font-size="13" fill="#111827">Entry / Exit</text>
  <rect x="80" y="110" width="130" height="40" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="103" y="135" font-family="Arial, sans-serif" font-size="13" fill="#111827">Entry / Exit</text>
</svg>
