name: CI — web
on:
  pull_request:
    paths:
      - "APP/web/**"
      - "DEMOS/olympia-sandwich/**"
      - "DEMOS/collector-standard/**"
      - ".github/workflows/ci-web.yml"
  push:
    branches: [main]
    paths:
      - "APP/web/**"
      - "DEMOS/olympia-sandwich/**"
      - "DEMOS/collector-standard/**"
      - ".github/workflows/ci-web.yml"

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: APP/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: APP/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Olympia collector race, source and art preservation
        run: node ../../DEMOS/olympia-sandwich/verify.mjs
      - name: Discover demo state and offer navigation
        run: node --import tsx scripts/discover-demo-selftest.ts
      - name: Olympia prospect menu and standard-game contracts
        run: node --import tsx scripts/olympia-selftest.ts
      - name: Maracaibo sample split bill and safe Toast handoff
        run: npm run maracaibo-split-bill:selftest
      - name: Maracaibo concurrent football and recovery
        run: npm run maracaibo-football:selftest
      - name: Maracaibo table visit lifecycle and access boundaries
        run: npm run maracaibo-visits:selftest
      - name: Owner portal and billing safeguards
        run: |
          npx --no-install tsx scripts/owner-billing-selftest.ts
          npx --no-install tsx scripts/owner-account-selftest.ts
          npx --no-install tsx scripts/owner-request-selftest.ts
          npx --no-install tsx scripts/owner-menu-selftest.ts
          npm run owner-app:selftest
      - name: Disabled owner queue and Bodega pilot safety
        run: |
          node --import tsx scripts/owner-request-reliability-selftest.ts
          node --import tsx scripts/owner-request-actions-selftest.ts
          node --import tsx scripts/owner-queue-client-selftest.ts
          node scripts/account-queue-compatibility-selftest.mjs
          node --import tsx scripts/account-import-selftest.ts
          node --import tsx scripts/account-actions-selftest.ts
          node scripts/account-staging-db-selftest.mjs
          node --import tsx scripts/bodega-controls-selftest.ts
          node scripts/bodega-controls-db-selftest.mjs
      - name: Bodega launch and Square cleanup regressions
        run: |
          npm run bodega-launch:selftest
          node scripts/square-cleanup-db-selftest.mjs
          npm run bodega-traffic:selftest
          npm run traffic:selftest
          npm run traffic-morning:selftest
      - run: npm run build
